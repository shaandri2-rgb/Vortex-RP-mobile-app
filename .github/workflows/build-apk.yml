name: Build and publish VORTEX RP Launcher APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.gradle'
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: vortex-launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build launcher APK
        run: gradle assembleDebug

      - name: Verify and name APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk VORTEX-RP.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose VORTEX-RP.apk

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vortex-launcher-build-${{ github.run_number }}
          name: VORTEX RP Launcher build ${{ github.run_number }}
          files: VORTEX-RP.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
