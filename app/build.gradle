plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vortexrp.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vortexrp.mobile'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
